<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://qjnqnchqqbuzjvlkytjl.supabase.co; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="按科目选择医学题库，查看题目来源和逐项解析。">
  <title>大仓鼠 · 医学题库</title>
  <link rel="stylesheet" href="./site.css?v=3">
  <script type="module" src="./site.js?v=2"></script>
</head>
<body>
  <header class="top">
    <div class="mast">
      <a class="brand" href="./">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.5 11.5C7.6 10.6 7 8.4 8.2 7.2C9.4 6 11.6 6.7 12.6 8.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M22.5 11.5C24.4 10.6 25 8.4 23.8 7.2C22.6 6 20.4 6.7 19.4 8.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="7.5" y="10" width="17" height="14.5" rx="7.5" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="13" cy="16" r="1.2" fill="currentColor"/>
            <circle cx="19" cy="16" r="1.2" fill="currentColor"/>
            <path d="M14.7 19.2C15.4 19.8 16.6 19.8 17.3 19.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">大仓鼠<small>MED</small></span>
      </a>
      <nav aria-label="账号">
        <span id="account" hidden></span>
        <button id="sign-in" type="button" class="btn ghost">登录</button>
        <button id="sign-up" type="button" class="btn primary">注册开通</button>
        <button id="sign-out" type="button" class="btn ghost" hidden>退出登录</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero-copy">
        <div class="hero-kicker"><span class="kicker-dot" aria-hidden="true"></span>医学本科期末复习题库</div>
        <h1>医学题库</h1>
        <p class="hero-lead">按科目整理历年试卷、章节习题与逐项解析，安静专注地完成每一轮复习。</p>
        <div class="filters">
          <label for="course-search" class="sr-only">搜索科目或题库</label>
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.8" stroke="currentColor" stroke-width="1.8"/>
              <path d="M16.2 16.2L20.5 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="course-search" type="search" placeholder="搜索科目或题库，如：药理学、诊断学、期中试卷">
          </div>
        </div>
        <p id="library-stats" class="library-stats" hidden></p>
      </div>

      <div class="hero-art" aria-hidden="true">
        <div class="orbital-frame">
          <svg class="orbital-svg" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="160" cy="160" r="142" stroke="currentColor" stroke-opacity="0.11" stroke-dasharray="3 7"/>
            <circle cx="160" cy="160" r="106" stroke="currentColor" stroke-opacity="0.14"/>
            <circle cx="160" cy="160" r="68" stroke="currentColor" stroke-opacity="0.09"/>
            <path d="M160 12V36M160 284V308M12 160H36M284 160H308" stroke="currentColor" stroke-opacity="0.18" stroke-linecap="round"/>
          </svg>
          <div class="hero-emblem">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 10V38M10 24H38" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.24"/>
              <path d="M14 17.5C11.4 16.2 10.6 13.1 12.2 11.4C13.8 9.7 17 10.7 18.4 13.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M34 17.5C36.6 16.2 37.4 13.1 35.8 11.4C34.2 9.7 31 10.7 29.6 13.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <rect x="11.5" y="15.5" width="25" height="21" rx="10.5" stroke="currentColor" stroke-width="2"/>
              <circle cx="19.5" cy="24" r="1.6" fill="currentColor"/>
              <circle cx="28.5" cy="24" r="1.6" fill="currentColor"/>
              <path d="M22 28.5C23.1 29.4 24.9 29.4 26 28.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="float-chip chip-a">
            <span class="chip-dot"></span>
            <div>
              <strong>逐项解析</strong>
              <span>选项剖析 · 教材页码</span>
            </div>
          </div>
          <div class="float-chip chip-b">
            <span class="chip-dot warm"></span>
            <div>
              <strong>云端同步</strong>
              <span>错题本 · 收藏 · 进度</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="catalog-top" id="catalog-controls">
      <div class="catalog-heading">
        <span class="section-eyebrow">DIRECTORY</span>
        <h2>按科目浏览</h2>
      </div>
      <div class="catalog-filters" role="group" aria-label="筛选科目">
        <button type="button" data-catalog-filter="indexed" aria-pressed="true">有题库目录</button>
        <button type="button" data-catalog-filter="all" aria-pressed="false">全部科目</button>
        <button type="button" data-catalog-filter="open" aria-pressed="false">已开放</button>
      </div>
    </div>
    <section id="catalog" aria-label="科目目录" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>联系邮箱 <a href="mailto:ShalonPigman176438@hotmail.com">ShalonPigman176438@hotmail.com</a></p>
    </div>
  </footer>

  <template id="course-card">
    <a class="course-card">
      <div class="card-head">
        <div class="card-icon" aria-hidden="true"></div>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </div>
      <div class="card-copy"><h3></h3><p></p></div>
      <span class="card-status"></span>
    </a>
  </template>

  <dialog id="login" aria-labelledby="login-title">
    <button type="button" id="close-auth" class="btn secondary close" aria-label="关闭">×</button>
    <span class="dialog-eyebrow">ACCOUNT</span>
    <h2 id="login-title">大仓鼠账号</h2>
    <form id="student-form" class="portal-form">
      <label for="student-email">邮箱</label>
      <input id="student-email" type="email" autocomplete="username" required maxlength="254">
      <label for="student-password">密码</label>
      <input id="student-password" type="password" autocomplete="current-password" required maxlength="72">
      <button class="btn primary" type="submit">登录</button>
      <button class="btn ghost" type="button" data-auth-view="register">注册账号</button>
      <div class="auth-links">
        <button type="button" data-auth-view="legacy">旧 ID 迁移</button>
        <button type="button" data-auth-view="recovery">忘记密码</button>
      </div>
    </form>

    <form id="registration-form" class="portal-form" hidden>
      <label for="registration-email">邮箱（登录账号）</label>
      <input id="registration-email" type="email" autocomplete="username" required maxlength="254">
      <a class="btn ghost purchase-link" id="registration-purchase" href="https://m.tb.cn/h.jK5Tm0y?tk=R1ms6hisfuR" target="_blank" rel="noopener noreferrer">去闲鱼购买 · ¥9.90</a>
      <label for="registration-key" id="registration-key-label">闲鱼订单编号</label>
      <input id="registration-key" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"
        required maxlength="128" aria-describedby="registration-hint">
      <p id="registration-hint" class="auth-note">付款后，从闲鱼订单详情复制订单编号。注册通过后，管理员会复核订单。</p>
      <div id="registration-nickname-field" class="admin-field">
        <label for="registration-nickname">昵称（选填）</label>
        <input id="registration-nickname" type="text" autocomplete="nickname" maxlength="40"
          placeholder="留空会生成“学员+四位编号”">
      </div>
      <button class="btn primary" type="submit">发送验证码</button>
      <button class="btn ghost" type="button" data-auth-view="login">返回登录</button>
    </form>

    <form id="verification-form" class="portal-form" hidden>
      <p class="auth-note" id="verification-note"></p>
      <label for="verification-code">邮箱验证码</label>
      <input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code"
        pattern="[0-9]{6,10}" maxlength="10" required>
      <label for="verification-password">设置密码</label>
      <input id="verification-password" type="password" autocomplete="new-password" minlength="8"
        maxlength="72" required placeholder="至少 8 个字符">
      <button class="btn primary" id="verification-submit" type="submit">验证并激活账号</button>
      <div class="auth-links">
        <button type="button" id="resend-code">重新发送</button>
        <button type="button" data-auth-view="login">返回登录</button>
      </div>
    </form>
    <p id="login-error" class="auth-message" role="alert" hidden></p>
  </dialog>
</body>
</html>
